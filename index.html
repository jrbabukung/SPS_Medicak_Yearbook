<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yearbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Trirong:wght@300;400;600&family=Bai+Jamjuree:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETTE — "Salon Nocturne"
   ============================================================ */
:root{
  --ink:#140E1C; --velvet:#241A34; --velvet-2:#2E2242;
  --champagne:#EFD5A3; --foil:#C79B4A; --blush:#E9A99F;
  --pearl:#F6F1EA; --muted:#A38FBB; --line:rgba(239,213,163,.22);
  --display:'Italiana','Trirong',Georgia,serif;
  --thai:'Trirong',serif;
  --body:'Bai Jamjuree','Trirong',system-ui,sans-serif;
  --arch:52% 52% 10px 10px / 40% 40% 5px 5px;
  --ease:cubic-bezier(.22,.8,.28,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--pearl);font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 700px at 50% -12%, rgba(199,155,74,.20), transparent 62%),
    radial-gradient(760px 620px at 88% 108%, rgba(233,169,159,.10), transparent 60%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.32;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
.shell{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 22px 140px}
::selection{background:var(--foil);color:var(--ink)}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px;border-radius:3px}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{padding:76px 0 34px;text-align:center}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--foil);margin:0 0 20px}
.eyebrow .th{font-family:var(--thai);letter-spacing:.16em}
.masthead h1{font-family:var(--display);font-size:clamp(50px,10vw,112px);font-weight:400;
  line-height:.92;letter-spacing:.06em;margin:0}
.masthead h1 em{font-style:normal;display:block;
  background:linear-gradient(100deg,var(--foil) 6%,var(--champagne) 44%,#FFF6E2 54%,var(--foil) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.dek{font-family:var(--thai);font-weight:300;color:var(--muted);font-size:15px;
  letter-spacing:.05em;margin:22px auto 0;max-width:46ch;line-height:1.8}
.rule{width:100%;max-width:520px;height:1px;margin:34px auto 0;
  background:linear-gradient(90deg,transparent,var(--line) 18%,var(--foil),var(--line) 82%,transparent)}

/* ============================================================
   CONTROLS
   ============================================================ */
.controls{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 0 6px}
.field{position:relative}
.field input{width:min(320px,72vw);background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:999px;color:var(--pearl);font-family:var(--body);font-size:14px;font-weight:300;
  padding:11px 18px 11px 42px;transition:border-color .3s var(--ease),background .3s var(--ease)}
.field input::placeholder{color:rgba(163,143,187,.75)}
.field input:focus{border-color:var(--foil);background:rgba(255,255,255,.06);outline:none}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.6}

.frow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;max-width:820px}
.frow .lab{font-family:var(--thai);font-size:11px;letter-spacing:.2em;color:var(--muted);
  margin-right:4px;flex:none}
.chip{font-family:var(--thai);font-size:12.5px;letter-spacing:.04em;background:transparent;
  border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 16px;
  cursor:pointer;transition:.28s var(--ease)}
.chip.lat{font-family:var(--body);font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.chip:hover{color:var(--champagne);border-color:rgba(239,213,163,.5)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(239,213,163,.16),rgba(199,155,74,.1));
  border-color:var(--champagne);color:var(--champagne)}
.count{color:var(--muted);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:4px 0 0}

/* ============================================================
   THE WALL
   ============================================================ */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:52px 30px;padding:52px 0 0}
.niche{position:relative;text-align:center;transition:transform .5s var(--ease)}
.niche:hover{transform:translateY(-9px)}
body.editing .niche:hover{transform:none}

.frame{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--arch);cursor:pointer;
  background:linear-gradient(168deg,var(--velvet-2),var(--velvet));
  box-shadow:0 18px 44px -22px rgba(0,0,0,.95);transition:box-shadow .5s var(--ease)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.86) contrast(1.03);transition:filter .6s var(--ease),transform .8s var(--ease)}
.niche:hover .frame img{filter:saturate(1.05) contrast(1.05);transform:scale(1.045)}
.niche:hover .frame{box-shadow:0 26px 60px -24px rgba(199,155,74,.55)}
.frame::after{content:'';position:absolute;inset:7px;border-radius:var(--arch);
  border:1px solid rgba(239,213,163,.28);opacity:.45;pointer-events:none;
  transition:opacity .5s var(--ease),inset .5s var(--ease)}
.niche:hover .frame::after{opacity:1;inset:11px}
.frame::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,246,226,.14),transparent 42%,rgba(20,14,28,.62))}
.frame.drop,.portrait.drop{outline:2px dashed var(--champagne);outline-offset:-6px}

.monogram{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);
  font-size:60px;letter-spacing:.04em;color:rgba(239,213,163,.34)}
.monogram.th{font-family:var(--thai);font-size:44px;font-weight:300}

.niche .name{font-family:var(--display);font-size:23px;letter-spacing:.045em;margin:18px 0 0;line-height:1.25}
.niche .name.th{font-family:var(--thai);font-weight:400;font-size:19px;letter-spacing:.01em}
.niche .batch{font-family:var(--thai);font-size:11px;letter-spacing:.22em;color:var(--foil);margin:9px 0 0}
.niche .role{font-family:var(--thai);font-size:12.5px;font-weight:300;line-height:1.7;
  color:var(--muted);margin:9px 0 0}
.jobwrap{margin:11px 0 0}

/* the ตำแหน่ง badge — a pill when reading, a dropdown when editing */
.job{display:inline-block;font-family:var(--body);font-size:9.5px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:var(--champagne);
  border:1px solid var(--line);border-radius:999px;padding:5px 14px}
select.job{background-color:rgba(239,213,163,.07);color:var(--champagne);cursor:pointer;
  appearance:none;-webkit-appearance:none;padding:6px 30px 6px 15px;text-align:center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1l4 4 4-4' fill='none' stroke='%23EFD5A3' stroke-width='1.4'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
  transition:border-color .3s var(--ease)}
select.job:hover,select.job:focus{border-color:var(--champagne);outline:none}
select.job option{background:var(--velvet);color:var(--pearl);letter-spacing:normal;
  text-transform:none;font-size:14px}

.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty p{font-family:var(--thai);font-size:15px;margin:0 0 6px}
.empty span{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--foil)}

.addcard{text-align:center}
.addcard button{width:100%;aspect-ratio:3/4;border-radius:var(--arch);cursor:pointer;
  background:rgba(255,255,255,.02);border:1px dashed rgba(239,213,163,.38);color:var(--foil);
  font-family:var(--display);font-size:46px;transition:.35s var(--ease);display:grid;place-items:center}
.addcard button:hover{background:rgba(239,213,163,.08);border-color:var(--champagne);color:var(--champagne)}
.addcard p{font-family:var(--thai);font-size:12.5px;letter-spacing:.14em;color:var(--muted);margin:18px 0 0}

/* ============================================================
   INLINE EDITING
   ============================================================ */
[data-f]{border-radius:6px;transition:background .3s var(--ease),box-shadow .3s var(--ease)}
body.editing [data-f]{cursor:text;background:rgba(239,213,163,.05);
  box-shadow:inset 0 -1px 0 rgba(239,213,163,.3);padding:3px 9px}
body.editing [data-f]:hover{background:rgba(239,213,163,.1)}
body.editing [data-f]:focus{background:rgba(239,213,163,.13);box-shadow:inset 0 -1px 0 var(--champagne);outline:none}
[data-f]:empty::before{content:attr(data-ph);color:rgba(163,143,187,.5)}
body:not(.editing) [data-f]:empty{display:none}

.cam,.kill,.grip{display:none;position:absolute;z-index:3;border:0;cursor:pointer;border-radius:999px;
  transition:.3s var(--ease);align-items:center;justify-content:center}
body.editing .cam,body.editing .kill,body.editing .grip{display:flex}
.cam{right:10px;bottom:10px;width:38px;height:38px;background:rgba(20,14,28,.8);
  border:1px solid var(--line);backdrop-filter:blur(6px)}
.cam:hover{background:var(--champagne);border-color:var(--champagne)}
.cam:hover svg{stroke:#140E1C}
.kill{top:-11px;right:-11px;width:28px;height:28px;background:var(--velvet);border:1px solid var(--line);
  color:var(--muted);font-size:15px;line-height:1;font-family:var(--body)}
.kill:hover{color:var(--blush);border-color:var(--blush)}
.kill.arm{width:auto;padding:0 14px;font-family:var(--thai);font-size:11px;color:var(--blush);border-color:var(--blush)}

/* drag handle for reordering */
.grip{top:-11px;left:-11px;width:28px;height:28px;background:var(--velvet);border:1px solid var(--line);
  color:var(--muted);cursor:grab;touch-action:none}
.grip:hover{color:var(--champagne);border-color:var(--champagne)}
.grip:active{cursor:grabbing}
.niche.dragging{opacity:.4;pointer-events:none;transform:scale(.95)}
.wall.reordering .niche{transition:none}
.wall.reordering .frame{box-shadow:0 18px 44px -22px rgba(0,0,0,.95)}

.editpill{position:fixed;right:24px;bottom:24px;z-index:120;display:flex;align-items:center;gap:10px;
  border-radius:999px;cursor:pointer;padding:14px 24px;font-family:var(--thai);font-size:14px;
  border:1px solid var(--line);background:rgba(28,20,42,.9);color:var(--muted);
  backdrop-filter:blur(14px);box-shadow:0 14px 40px -16px rgba(0,0,0,.9);transition:.35s var(--ease)}
.editpill:hover{color:var(--champagne);border-color:var(--champagne)}
body.editing .editpill{background:linear-gradient(180deg,var(--champagne),var(--foil));
  color:var(--ink);border-color:transparent;font-weight:500}
.editpill svg{flex:none}
.saved{position:fixed;right:26px;bottom:84px;z-index:120;font-family:var(--thai);font-size:12px;
  letter-spacing:.14em;color:var(--foil);opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
.saved.show{opacity:1}
.hint{display:none;text-align:center;font-family:var(--thai);font-size:12px;color:var(--muted);
  margin:26px 0 0;line-height:1.8}
body.editing .hint{display:block}

/* ============================================================
   PROFILE
   ============================================================ */
.profile{position:fixed;inset:0;z-index:60;overflow-y:auto;background:rgba(12,8,18,.82);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
.profile.open{opacity:1;visibility:visible}
.profile-inner{max-width:1000px;margin:0 auto;padding:26px 22px 120px;
  transform:translateY(26px);transition:transform .55s var(--ease)}
.profile.open .profile-inner{transform:none}

.backbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-family:var(--body);
  font-size:12px;letter-spacing:.24em;text-transform:uppercase;padding:14px 0;
  display:inline-flex;align-items:center;gap:11px;transition:color .3s var(--ease)}
.backbtn:hover{color:var(--champagne)}
.backbtn span{display:inline-block;transition:transform .3s var(--ease)}
.backbtn:hover span{transform:translateX(-5px)}

.portrait-row{display:grid;grid-template-columns:300px 1fr;gap:52px;align-items:end;padding:14px 0 40px}
.portrait{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--arch);
  background:linear-gradient(168deg,var(--velvet-2),var(--velvet));
  box-shadow:0 34px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(239,213,163,.2)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait::after{content:'';position:absolute;inset:10px;border-radius:var(--arch);
  border:1px solid rgba(239,213,163,.45);pointer-events:none}
.portrait .monogram{font-size:92px}
.portrait .monogram.th{font-size:70px}
.photohint{display:none;font-family:var(--thai);font-size:11.5px;color:var(--muted);
  margin:15px 0 0;text-align:center;line-height:1.7}
body.editing .photohint{display:block}
.photohint button{background:none;border:0;color:var(--muted);cursor:pointer;font-family:var(--thai);
  font-size:11.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.photohint button:hover{color:var(--blush)}

.meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.meta .batch{font-family:var(--thai);font-size:12px;letter-spacing:.28em;color:var(--foil);margin:0}
.titleblock h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,6.4vw,76px);
  line-height:1.02;letter-spacing:.035em;margin:0}
.titleblock h2.th{font-family:var(--thai);font-weight:300;letter-spacing:0;font-size:clamp(34px,5.4vw,62px)}
.titleblock .role{font-family:var(--thai);color:var(--muted);font-size:15px;margin:18px 0 0;line-height:1.7}
.gold-rule{height:1px;margin:34px 0 0;background:linear-gradient(90deg,var(--foil),rgba(239,213,163,.16) 62%,transparent)}

.say{position:relative;max-width:66ch;padding:44px 0 0}
.say .label{font-family:var(--thai);font-size:11.5px;letter-spacing:.26em;color:var(--foil);
  margin:0 0 26px;display:inline-block}
.say .quote{position:absolute;left:-6px;top:64px;font-family:var(--display);font-size:110px;
  line-height:1;color:rgba(239,213,163,.16);pointer-events:none;user-select:none}
.say .msg{font-family:var(--thai);font-weight:300;font-size:clamp(18px,2.4vw,23px);line-height:1.95;
  color:rgba(246,241,234,.94);margin:0;white-space:pre-wrap;min-height:2em;
  padding-left:38px !important;position:relative;z-index:1}
body.editing .say .msg{min-height:180px;padding:16px 18px 16px 38px !important;
  border-radius:14px;box-shadow:inset 0 0 0 1px rgba(239,213,163,.28)}
body.editing .say .msg:focus{box-shadow:inset 0 0 0 1px var(--champagne)}

.pager{display:flex;justify-content:space-between;gap:18px;margin-top:64px}
.pager button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);
  cursor:pointer;padding:13px 24px;max-width:47%;font-family:var(--thai);font-size:13px;
  text-align:left;transition:.3s var(--ease)}
.pager button:hover:not(:disabled){color:var(--champagne);border-color:var(--champagne)}
.pager button:disabled{opacity:.22;cursor:default}
.pager small{display:block;font-family:var(--body);font-size:9.5px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--foil);margin-bottom:5px}
.pager .nx{text-align:right}

.removeperson{display:none;margin-top:46px}
body.editing .removeperson{display:block}
.removeperson button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);
  cursor:pointer;font-family:var(--thai);font-size:12.5px;padding:11px 22px;transition:.3s var(--ease)}
.removeperson button:hover,.removeperson button.arm{color:var(--blush);border-color:var(--blush)}

.footnote{text-align:center;padding:34px 0 0;display:none}
body.editing .footnote{display:block}
.footnote button{background:none;border:0;color:rgba(163,143,187,.6);cursor:pointer;
  font-family:var(--thai);font-size:11.5px;text-decoration:underline;text-underline-offset:4px}
.footnote button:hover{color:var(--champagne)}

/* ============================================================
   RESPONSIVE / A11Y / PRINT
   ============================================================ */
@media (max-width:760px){
  .portrait-row{grid-template-columns:1fr;gap:30px;align-items:start}
  .portrait{max-width:230px}
  .wall{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:44px 20px}
  .niche .name{font-size:19px}.niche .name.th{font-size:17px}
  .masthead{padding:52px 0 26px}
  .editpill{right:16px;bottom:16px;padding:13px 20px}
  .saved{right:18px;bottom:74px}
  .say .quote{font-size:72px;top:58px}
  .frow .lab{width:100%;text-align:center;margin:0 0 2px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
@media print{
  body{background:#fff;color:#111}
  body::before,body::after,.controls,.editpill,.saved,.addcard,.pager,.backbtn{display:none !important}
  .frame,.portrait{box-shadow:none;border:1px solid #ccc}
  .niche .name,.titleblock h2{color:#111}
}
</style>

<div class="shell">
  <header class="masthead">
    <p class="eyebrow"><span class="th">หนังสือรุ่น</span> &nbsp;·&nbsp; 2026</p>
    <h1>THE<em>YEARBOOK</em></h1>
    <p class="dek">แตะที่ภาพเพื่ออ่านสิ่งที่แต่ละคนอยากบอก</p>
    <div class="rule"></div>
  </header>

  <div class="controls">
    <div class="field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#EFD5A3" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
      </svg>
      <input id="q" type="search" placeholder="ค้นหาชื่อ…" aria-label="ค้นหาชื่อ">
    </div>
    <div class="frow" id="jobChips"></div>
    <div class="frow" id="batchChips"></div>
    <p class="count" id="count"></p>
  </div>

  <main class="wall" id="wall" aria-live="polite"></main>

  <p class="hint">ลากปุ่มมุมซ้ายบนของการ์ดเพื่อสลับลำดับ · หรือกดปุ่มนั้นแล้วใช้ปุ่มลูกศรซ้าย-ขวา<br>
    <span id="modeNote"></span></p>
  <div class="footnote">
    <button id="backup">ดาวน์โหลดสำเนาข้อมูลเก็บไว้</button>
    <span style="color:rgba(163,143,187,.35);margin:0 10px">·</span>
    <button id="reset">คืนค่าข้อมูลตัวอย่าง</button>
  </div>
</div>

<section class="profile" id="profile" role="dialog" aria-modal="true" aria-label="โปรไฟล์">
  <div class="profile-inner" id="profileInner"></div>
</section>

<button class="editpill" id="editpill" aria-pressed="false">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 20h4L20 8l-4-4L4 16v4z"/>
  </svg>
  <span id="editlabel">แก้ไขหน้านี้</span>
</button>
<div class="saved" id="saved">บันทึกแล้ว</div>

<input type="file" id="photoFile" accept="image/*" hidden>

<script>
/* ============================================================
   1. SETTINGS
   Leave SUPABASE blank and the yearbook saves on this device only.
   Fill both in and everyone who opens the page shares one yearbook.
   Setup steps are in README.md.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL : '',            // e.g. 'https://abcdefg.supabase.co'
  SUPABASE_KEY : '',            // the public "anon" key
  TABLE        : 'people',
  EDIT_CODE    : ''             // optional: a word people must type to edit
};

/* ตำแหน่ง — add or rename freely, the filter follows this list */
const JOBS = ['BD','Logistic','IT','Programmer'];
const DEFAULT_LABEL = 'คำที่อยากบอก';

/* ============================================================
   2. STORAGE
   ============================================================ */
const KEY = 'yearbook:people';
const REMOTE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const api = p => `${CONFIG.SUPABASE_URL.replace(/\/$/,'')}/rest/v1/${CONFIG.TABLE}${p}`;
const authHeaders = () => ({ apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY });

/* when no database is configured, keep edits on this device.
   uses the sandbox store if present, otherwise the browser's own. */
const local = {
  async get(){
    if(window.storage && window.storage.get){
      const r = await window.storage.get(KEY);
      return r ? r.value : null;
    }
    return localStorage.getItem(KEY);
  },
  async set(v){
    if(window.storage && window.storage.set) return window.storage.set(KEY, v);
    localStorage.setItem(KEY, v);
  }
};

const store = {
  async all(){
    if(REMOTE){
      const r = await fetch(api('?select=*&order=ord.asc'), { headers: authHeaders() });
      if(!r.ok) throw new Error(await r.text());
      return await r.json();
    }
    try{ const v = await local.get(); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  },
  /* accepts one record or an array of them */
  async put(payload){
    if(REMOTE){
      const r = await fetch(api(''), {
        method:'POST',
        headers:{ ...authHeaders(), 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates' },
        body: JSON.stringify(payload)
      });
      if(!r.ok) throw new Error(await r.text());
    } else await local.set(JSON.stringify(people));
  },
  async remove(id){
    if(REMOTE){
      const r = await fetch(api('?id=eq.' + encodeURIComponent(id)), { method:'DELETE', headers: authHeaders() });
      if(!r.ok) throw new Error(await r.text());
    } else await local.set(JSON.stringify(people));
  }
};

const $ = s => document.querySelector(s);
const isThai = s => /[\u0E00-\u0E7F]/.test(s || '');
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let people = [], view = [], openId = null;
let query = '', batch = 'all', job = 'all';
let editing = false, unlocked = !CONFIG.EDIT_CODE, photoTarget = null;

function normalise(p){
  const o = { id:p.id || uid(), name:p.name||'', job:p.job||'', batch:p.batch||'', role:p.role||'',
              photo:p.photo||'', label:p.label||DEFAULT_LABEL, message:p.message||'',
              ord: typeof p.ord === 'number' ? p.ord : 0 };
  if(!o.message && Array.isArray(p.qa))                    // carry over older entries
    o.message = p.qa.map(x => x && x.a).filter(Boolean).join('\n\n');
  return o;
}

async function load(){
  let data = null;
  try{ data = await store.all(); }
  catch(e){ flash('เชื่อมต่อฐานข้อมูลไม่ได้'); }
  people = (data && data.length ? data : SEED).map(normalise);
  people.sort((a,b) => (a.ord||0) - (b.ord||0));
  people.forEach((p,i) => p.ord = i + 1);
  render();
  if(REMOTE && (!data || !data.length)) store.put(people).catch(()=>{});
}

const getP = id => people.find(p => p.id === id);

function flash(msg){
  const s = $('#saved'); s.textContent = msg; s.classList.add('show');
  clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('show'), 2000);
}
const timers = {};
function saveSoon(id){
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    const p = getP(id); if(!p) return;
    try{ await store.put(p); flash('บันทึกแล้ว'); }
    catch(e){ flash('บันทึกไม่สำเร็จ'); }
  }, 600);
}
async function saveMany(list){
  if(!list.length) return;
  try{ await store.put(list); flash('บันทึกลำดับแล้ว'); }
  catch(e){ flash('บันทึกไม่สำเร็จ'); }
}

/* ---------- inline editing ---------- */
function applyEditable(){
  document.querySelectorAll('[data-f]').forEach(el => {
    if(editing){
      el.setAttribute('contenteditable','plaintext-only');
      if(el.contentEditable !== 'plaintext-only') el.setAttribute('contenteditable','true');
      el.setAttribute('spellcheck','false');
    } else el.removeAttribute('contenteditable');
  });
}
function setEditing(on){
  if(on && !unlocked){
    if(window.prompt('ใส่รหัสเพื่อแก้ไข') !== CONFIG.EDIT_CODE){ flash('รหัสไม่ถูกต้อง'); return; }
    unlocked = true;
  }
  editing = on;
  document.body.classList.toggle('editing', on);
  $('#editpill').setAttribute('aria-pressed', String(on));
  $('#editlabel').textContent = on ? 'เสร็จแล้ว' : 'แก้ไขหน้านี้';
  const wasOpen = openId;
  render();
  if(wasOpen) openProfile(wasOpen);
}
function commit(el){
  const p = getP(el.dataset.id); if(!p) return;
  p[el.dataset.f] = el.textContent.replace(/\u00a0/g,' ').replace(/\s+$/,'');
  saveSoon(p.id);
}
document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('[data-f]'); if(!el) return;
  if(el.textContent.trim() === '') el.innerHTML = '';
  commit(el);
});
document.addEventListener('blur', e => {
  const el = e.target.closest && e.target.closest('[data-f]'); if(!el) return;
  commit(el);
  if(el.dataset.f === 'batch') renderChips();
}, true);
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('[data-f]');
  if(el && e.key === 'Enter' && el.dataset.f !== 'message'){ e.preventDefault(); el.blur(); }
});
document.addEventListener('paste', e => {
  const el = e.target.closest && e.target.closest('[data-f]'); if(!el) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
/* the ตำแหน่ง dropdown */
document.addEventListener('change', e => {

  const p = getP(s.dataset.id); if(!p) return;

/* ---------- reorder ---------- */
let drag = null;
function commitOrder(focusId){
  const ids = [...$('#wall').querySelectorAll('.niche')].map(n => n.dataset.id);
  const shown = new Set(ids);
  const byId = Object.fromEntries(people.map(p => [p.id, p]));
  const slots = [];
  people.forEach((p,i) => { if(shown.has(p.id)) slots.push(i); });
  const next = people.slice();
  slots.forEach((slot,k) => { next[slot] = byId[ids[k]]; });
  people = next;

  const changed = [];
  people.forEach((p,i) => { if(p.ord !== i + 1){ p.ord = i + 1; changed.push(p); } });
  saveMany(changed);

  render();
  if(focusId){
    const g = document.querySelector(`.niche[data-id="${focusId}"] .grip`);
    if(g) g.focus();
  }
}
$('#wall').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip');
  if(!g || !editing) return;
  e.preventDefault();
  const card = g.closest('.niche');
  g.setPointerCapture(e.pointerId);
  drag = { card, pid:e.pointerId, moved:false, id:card.dataset.id };
  card.classList.add('dragging');
  $('#wall').classList.add('reordering');
});
$('#wall').addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  drag.moved = true;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const t = under && under.closest ? under.closest('.niche') : null;
  if(!t || t === drag.card) return;
  const r = t.getBoundingClientRect();
  if(e.clientX < r.left + r.width / 2) t.before(drag.card);
  else t.after(drag.card);
});
function endDrag(){
  if(!drag) return;
  drag.card.classList.remove('dragging');
  $('#wall').classList.remove('reordering');
  const { moved, id } = drag;
  drag = null;
  if(moved) commitOrder(id);
}
$('#wall').addEventListener('pointerup', endDrag);
$('#wall').addEventListener('pointercancel', endDrag);

$('#wall').addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.grip');
  if(g){
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const card = g.closest('.niche');
    const sib = e.key === 'ArrowLeft' ? card.previousElementSibling : card.nextElementSibling;
    if(!sib || !sib.classList.contains('niche')) return;
    if(e.key === 'ArrowLeft') sib.before(card); else sib.after(card);
    commitOrder(card.dataset.id);
    return;
  }
  const fr = e.target.closest && e.target.closest('[data-open]');
  if(fr && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openProfile(fr.dataset.open); }
});

/* ---------- photos ---------- */
function shrink(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 760, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function setPhoto(id, file){
  const p = getP(id); if(!p) return;
  try{ p.photo = await shrink(file); }catch(err){ flash('อ่านรูปไม่ได้'); return; }
  saveSoon(id);
  if(openId === id) openProfile(id); else render();
}
$('#photoFile').onchange = async e => {
  const f = e.target.files[0], t = photoTarget;
  e.target.value = ''; photoTarget = null;
  if(f && t) await setPhoto(t, f);
};
document.addEventListener('dragover', e => {
  const t = e.target.closest && e.target.closest('.frame,.portrait');
  if(!t || !editing) return;
  e.preventDefault(); t.classList.add('drop');
});
document.addEventListener('dragleave', e => {
  const t = e.target.closest && e.target.closest('.frame,.portrait');
  if(t) t.classList.remove('drop');
});
document.addEventListener('drop', async e => {
  const t = e.target.closest && e.target.closest('.frame,.portrait');
  if(!t || !editing) return;
  e.preventDefault(); t.classList.remove('drop');
  const f = [...(e.dataTransfer.files||[])].find(x => x.type.startsWith('image/'));
  if(f) await setPhoto(t.dataset.open || openId, f);
});

/* ---------- two-step delete ---------- */
function arm(btn, run){
  if(btn.classList.contains('arm')) return run();
  btn.classList.add('arm');
  btn.dataset.old = btn.textContent;
  btn.textContent = 'ลบจริงไหม?';
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.classList.remove('arm'); btn.textContent = btn.dataset.old; }, 3500);
}
async function removePerson(id){
  people = people.filter(p => p.id !== id);
  try{ await store.remove(id); flash('ลบแล้ว'); }catch(e){ flash('ลบไม่สำเร็จ'); }
}

/* ---------- clicks ---------- */
$('#wall').addEventListener('click', e => {
  if(e.target.closest('.grip')) return;
  const cam = e.target.closest('[data-cam]');
  if(cam){ photoTarget = cam.closest('.niche').dataset.id; $('#photoFile').click(); return; }
  const kill = e.target.closest('[data-kill]');
  if(kill){ arm(kill, async () => { await removePerson(kill.dataset.kill); render(); }); return; }
  if(e.target.closest('#addNew')) return addPerson();
  if(e.target.closest('[data-f]') || e.target.closest('[data-sel]')) return;
  const fr = e.target.closest('[data-open]');
  if(fr) openProfile(fr.dataset.open);
});
$('#profile').addEventListener('click', e => {
  if(e.target.id === 'profile' || e.target.closest('#back')) return closeProfile();
  if(e.target.closest('[data-cam]')){ photoTarget = openId; $('#photoFile').click(); return; }
  if(e.target.closest('[data-rmphoto]')){ getP(openId).photo = ''; saveSoon(openId); openProfile(openId); return; }
  const kp = e.target.closest('[data-killperson]');
  if(kp){ arm(kp, async () => { await removePerson(kp.dataset.killperson); closeProfile(); }); return; }
  const g = e.target.closest('[data-go]');
  if(g) openProfile(g.dataset.go);
});

function addPerson(){
  const p = normalise({ id: uid(),
                        job: job === 'all' ? '' : job,
                        batch: batch === 'all' ? '' : batch,
                        ord: people.reduce((m,x) => Math.max(m, x.ord||0), 0) + 1 });
  people.push(p);
  saveSoon(p.id);
  if(!editing) setEditing(true);
  query = ''; $('#q').value = '';
  render();
  openProfile(p.id);
  const n = $('#profileInner').querySelector('[data-f="name"]');
  if(n) n.focus();
}

/* ---------- controls ---------- */
$('#batchChips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  batch = c.dataset.b; render();
});
$('#jobChips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  job = c.dataset.job; render();
});
$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#editpill').onclick = () => setEditing(!editing);

document.addEventListener('keydown', e => {
  if(e.target.closest && (e.target.closest('[data-f]') || e.target.closest('.grip'))) return;
  if(e.key === 'Escape' && openId) closeProfile();
  if(openId && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
    const i = view.findIndex(p => p.id === openId);
    const t = view[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if(t) openProfile(t.id);
  }
});

if(REMOTE) window.addEventListener('focus', async () => {
  if(editing || openId) return;
  try{
    const data = await store.all();
    if(data && data.length){ people = data.map(normalise); render(); }
  }catch(e){}
});

$('#modeNote').textContent = REMOTE
  ? 'โหมดฐานข้อมูลร่วม — ทุกคนเห็นการแก้ไขเดียวกัน'
  : 'โหมดตัวอย่าง — การแก้ไขเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น';

$('#reset').onclick = async e => {
  const b = e.currentTarget;
  if(!b.dataset.arm){
    b.dataset.arm = '1'; b.dataset.old = b.textContent; b.textContent = 'ล้างของเดิมทั้งหมดนะ?';
    setTimeout(() => { delete b.dataset.arm; b.textContent = b.dataset.old; }, 3500);
    return;
  }
  delete b.dataset.arm; b.textContent = b.dataset.old;
  people = SEED.map(normalise);
  try{ await store.put(people); }catch(err){}
  render(); flash('คืนค่าข้อมูลตัวอย่างแล้ว');
};

$('#backup').onclick = () => {
  const blob = new Blob([JSON.stringify(people, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yearbook-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

load();
</script>
</html>
